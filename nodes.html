  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0B0E14;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: 'Inter', system-ui, sans-serif;
      position: relative;
    }
    /* ── 深空弥散背景 ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 140% 80% at 50% 100%, #0B0E14 0%, #1A1A2E 70%),
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(0,200,255,0.12) 0%, rgba(0,120,255,0.06) 30%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(100,220,255,0.08) 0%, transparent 50%);
      pointer-events: none;
    }
    #nodeCanvas {
      position: absolute; inset: 0; z-index: 1;
      width: 100%; height: 100%;
      touch-action: none;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      height: 48px; padding: 0 16px;
    }
    .nav-logo { font-size: 15px; font-weight: 800; letter-spacing: -0.5px; color: #1e40af; flex-shrink: 0; }
    .nav-left { display: flex; align-items: center; gap: 20px; }
    .nav-center {
      position: absolute; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center;
    }
    .nav-links { display: flex; gap: 32px; }
    .nav-subtitle {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: rgba(255,255,255,0.2);
      letter-spacing: 1.5px; white-space: nowrap;
      transition: color 0.3s;
    }
    .nav-subtitle:hover {
      color: rgba(30, 64, 175, 0.8);
    }
    .nav-sub-num { font-size: 22px; }
    .query-box {
      display: flex; align-items: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px;
      padding: 0 10px 0 14px;
      height: 34px;
      transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
    }
    .query-box:hover {
      border-color: rgba(30, 64, 175, 0.70);
      background: rgba(30, 64, 175, 0.08);
      box-shadow: 0 0 16px rgba(30, 64, 175, 0.12), inset 0 0 16px rgba(30, 64, 175, 0.04);
    }
    .query-box:focus-within {
      border-color: rgba(30, 64, 175, 1.0);
      background: rgba(30, 64, 175, 0.12);
      box-shadow: 0 0 20px rgba(30, 64, 175, 0.16), inset 0 0 20px rgba(30, 64, 175, 0.06);
    }
    .query-box .q-icon {
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      margin-right: 8px;
      line-height: 1;
      font-weight: 300;
    }
    .query-box:hover .q-icon { color: rgba(255,255,255,0.8); }
    .query-box:focus-within .q-icon { color: rgba(255,255,255,1.0); }
    .query-box input {
      width: 58px; padding: 0; border: none;
      background: transparent; color: #fff;
      font-size: 13px; font-family: 'Inter', sans-serif;
      text-align: center; outline: none;
      line-height: 1; letter-spacing: 0.3px;
      font-weight: 400;
      -moz-appearance: textfield;
    }
    .query-box input::-webkit-outer-spin-button,
    .query-box input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .query-box input::placeholder { color: rgba(255,255,255,0.3); font-weight: 300; letter-spacing: 0; }
    .query-box .q-sep {
      width: 1px; height: 16px;
      background: rgba(255,255,255,0.12);
      margin: 0 6px;
    }
    .query-box .q-go {
      background: none; border: none; color: rgba(255,255,255,0.3);
      font-size: 16px; cursor: pointer; padding: 0 2px;
      line-height: 1; transition: color 0.2s, transform 0.2s;
      font-family: 'Inter', sans-serif; font-weight: 200;
    }
    .query-box .q-go:hover { color: rgba(255,255,255,1.0); transform: translateX(1px); }
    .query-box:hover .q-go { color: rgba(255,255,255,0.5); }
    .query-box:focus-within .q-go { color: rgba(255,255,255,0.6); }
    .query-label {
      color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 400;

    }
    .node-info {
      position: fixed; left: 32px; top: 80px; z-index: 200;
      padding: 16px 24px;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08);

      opacity: 0; transition: opacity 0.25s;

    .node-info.show { opacity: 1; pointer-events: auto; }
    .node-info .num { font-size: 16px; font-weight: 500; color: rgba(255,255,255,0.5); }
    .node-info .gpg-status {
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 12px; line-height: 1.5;

    .node-info .gpg-status .gpg-icon { font-size: 14px; flex-shrink: 0; }
    .node-info .gpg-status.verified { color: rgba(68, 255, 136, 0.85); }
    .node-info .gpg-status.declared { color: rgba(255, 200, 68, 0.85); }
    .node-info .gpg-status.none { color: rgba(255,255,255,0.25); }
    .node-info .gpg-status .gpg-spinner {
      display: inline-block; width: 10px; height: 10px;

    @keyframes gpgSpin { to { transform: rotate(360deg); } }
    .query-highlight {
      position: fixed; pointer-events: none; z-index: 50;
      border: 1.5px solid rgba(255,255,255,0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 20px;
      opacity: 0; transition: opacity 0.3s;
    }
    .query-highlight.show { opacity: 0.7; }

    /* ── Three.js 覆盖层 ── */
    #threeCanvas {
      position: absolute; inset: 0; z-index: 2;
      width: 100%; height: 100%;
      opacity: 0; pointer-events: none;
    }
    #threeCanvas.show { pointer-events: auto; }

    /* ── Spiral Hero Wrapper ── */
    .spiral-hero {
      position: relative;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    .hero-scroll-hint {
      position: absolute; bottom: 32px; left: 0; right: 0; z-index: 20;
      text-align: center;

      transition: opacity 0.6s var(--ease-out);
    }
    .hero-scroll-hint.hidden { opacity: 0; }
    .hero-scroll-hint-arrow {
      width: 16px; height: 16px;
      margin: 8px auto 0;

      border-bottom: 1.5px solid rgba(255,255,255,0.3);

    .yintu {
      position: fixed; z-index: 80;

      writing-mode: vertical-rl;

      letter-spacing: 4px;
      pointer-events: none;

    }
    @media (max-width: 768px) {
      nav { height: 36px; padding: 0 12px; }

      .nav-subtitle { display: none; }
      .query-label { display: none; }
      .query-box { height: 40px; padding: 0 8px 0 12px; }
      .query-box input { width: 58px; }
      .query-box .q-go { padding: 6px 8px; }
      .node-info { left: 12px; top: 60px; padding: 12px 16px; font-size: 12px; right: 12px; border-radius: 8px; }
      .yintu { font-size: 48px; }
      .query-highlight { width: 18px; height: 18px; }
    }
  </style>

  <script>
    (function() {
      var canvas = document.getElementById('nodeCanvas');
      var ctx = canvas.getContext('2d');
      var W, H, cx, cy, dpr;

      var nodesPerRev = 12;
      var radiusStep = 28;
      var baseR = 40;
      var zoom = (window.innerWidth <= 768) ? 0.2 : 0.3;
      window.__zoom = zoom;
      var total = 384;        // 可视化绘制的会节点数
      var maxIndex = 129600;  // 协议允许的最大编号
      var DIZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
      var YIJING = [
        '乾','坤','屯','蒙','需','讼','师','比','小畜','履','泰','否',
        '同人','大有','谦','豫','随','蛊','临','观','噬嗑','贲','剥','复',
        '无妄','大畜','颐','大过','坎','离','咸','恒','遁','大壮','晋','明夷',
        '家人','睽','蹇','解','损','益','夬','姤','萃','升','困','井',
        '革','鼎','震','艮','渐','归妹','丰','旅','巽','兑','涣','节'
      ];
      var triBase = 108;
      var triMax = 348;
      var pulsePhase = 0;
      var pulseStart = performance.now();
      var offsetX = 0, offsetY = 0;
      var dragStartX, dragStartY, isDragging = false;
      var snapAnim = null;
      // 球面点数据（129,600 点 Fibonacci 分布，嵌入正方形内）
      var spherePts3D = (function() {
        var pts = [], N = 5408;
        for (var i = 0; i < N; i++) {
          var y = 1 - (i / (N - 1)) * 2;
          var r = Math.sqrt(1 - y * y);
          var theta = Math.PI * (3 - Math.sqrt(5)) * i;
          pts.push({ x: r * Math.cos(theta), y: y, z: r * Math.sin(theta) });
        }
        return pts;
      })();
      var sphereRotY = 0;

      function resize() {
        dpr = window.devicePixelRatio || 1;
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.scale(dpr, dpr);
        cx = W / 2;
        cy = H / 2;
        draw();
      }

      // 连续螺旋位置（t 从 0 ~ numRevs * nodesPerRev，子位在右下）
      function spiralPos(t) {
        var angle = 2 * Math.PI * t / nodesPerRev + Math.PI / 3;
        var radius = (baseR + t / nodesPerRev * radiusStep) * zoom;
        return { x: cx + radius * Math.cos(angle) + offsetX, y: cy + radius * Math.sin(angle) + offsetY };
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        var textAlpha = Math.max(0, Math.min(1, (zoom - 0.8) / 0.2));

        // ── 螺旋线（从圆心平滑引出） ──
        var tStart = -(baseR * nodesPerRev) / radiusStep;
        ctx.save();
        // 发光底层
        ctx.shadowColor = 'rgba(255,255,255,0.06)';
        ctx.shadowBlur = 4;

        // 实线部分：tStart → 359（前360个节点）
        ctx.beginPath();
        var solidEnd = 359;
        var steps1 = (solidEnd - tStart) * 6;
        for (var i = 0; i <= steps1; i++) {
          var t = tStart + (i / steps1) * (solidEnd - tStart);
          var p = spiralPos(t);
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.17)';
        ctx.lineWidth = 0.7;
        ctx.stroke();

        // 虚线部分：359 → 383（360→384的螺旋线条，以虚线表无常）
        ctx.beginPath();
        ctx.setLineDash([4.75, 4.75]);
        var dashEnd = total - 1;
        var steps2 = (dashEnd - solidEnd) * 6;
        for (var i = 0; i <= steps2; i++) {
          var t = solidEnd + (i / steps2) * (dashEnd - solidEnd);
          var p = spiralPos(t);
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.48)';
        ctx.lineWidth = 0.7;
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.shadowBlur = 0;
        ctx.restore();

        // ── 7 的路径（7,14,21...378 → 385 子位，虚线示未济） ──
        var path7Alpha = Math.max(0, Math.min(1, (1 - zoom) / 0.2));
        if (path7Alpha > 0.01) {
          ctx.save();

          // 实线：7 → 378
          ctx.beginPath();
          for (var si = 7; si <= total; si += 7) {
            var sp = spiralPos(si - 1);
            if (si === 7) ctx.moveTo(sp.x, sp.y);
            else ctx.lineTo(sp.x, sp.y);
          }
          ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.57 * path7Alpha).toFixed(3) + ')';
          ctx.lineWidth = 0.6;
          ctx.stroke();

          // 378 → 385（子位）
          var last7 = 378;
          var next7 = 385;
          ctx.beginPath();
          var pLast = spiralPos(last7 - 1);
          var pNext = spiralPos(next7 - 1);
          ctx.moveTo(pLast.x, pLast.y);
          ctx.lineTo(pNext.x, pNext.y);
          ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.57 * path7Alpha).toFixed(3) + ')';
          ctx.lineWidth = 0.6;
          ctx.stroke();

          // 385 位置标「子」
          if (textAlpha > 0.01) {
            ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.6 * path7Alpha).toFixed(3) + ')';
            ctx.font = Math.max(13, Math.min(18, baseR * 0.09)) + 'px "Inter", system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            var dx385 = pNext.x - cx, dy385 = pNext.y - cy;
            var dist385 = Math.sqrt(dx385 * dx385 + dy385 * dy385) || 1;
            var off385 = 14;
            ctx.fillText('子', pNext.x + (dy385 / dist385) * off385, pNext.y - (dx385 / dist385) * off385);
          }

          ctx.restore();
        }

        // ── 64 的倍数路径（64,128,192,256,320,384，未济色，与卦名同频） ──
        if (textAlpha > 0.01) {
          ctx.save();
          ctx.beginPath();
          for (var si = 64; si <= total; si += 64) {
            var sp = spiralPos(si - 1);
            if (si === 64) ctx.moveTo(sp.x, sp.y);
            else ctx.lineTo(sp.x, sp.y);
          }
          ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.85 * textAlpha).toFixed(3) + ')';
          ctx.lineWidth = 0.8;
          ctx.setLineDash([]);
          ctx.stroke();
          ctx.restore();
        }

        // ── 巳亥流星（自下而上，3s 周期） ──
        ctx.save();
        var siAngle = Math.PI / 3 + 5 * Math.PI / 6;
        function edgeX(angle) {
          var dx = Math.cos(angle), dy = Math.sin(angle);
          var tx = dx > 0 ? (W - cx) / dx : dx < 0 ? -cx / dx : Infinity;
          var ty = dy > 0 ? (H - cy) / dy : dy < 0 ? -cy / dy : Infinity;
          var t = Math.min(tx, ty);
          return { x: cx + dx * t, y: cy + dy * t };
        }
        var e1 = edgeX(siAngle);
        var e2 = edgeX(siAngle + Math.PI);

        // 基底淡线
        ctx.beginPath();
        ctx.moveTo(e1.x, e1.y);
        ctx.lineTo(e2.x, e2.y);
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 0.5;
        ctx.stroke();

        // 流星位置（自下而上：e1 → e2）
        var meteorT = pulsePhase;
        var mx = e1.x + (e2.x - e1.x) * meteorT;
        var my = e1.y + (e2.y - e1.y) * meteorT;

        // 流星尾迹
        var trailLen = 0.12;
        for (var tt = 0.005; tt < trailLen; tt += 0.005) {
          var trailPos = meteorT - tt;
          if (trailPos < 0) break;
          var tx = e1.x + (e2.x - e1.x) * trailPos;
          var ty = e1.y + (e2.y - e1.y) * trailPos;
          var alpha = (1 - tt / trailLen) * 0.5;
          var r = (1 - tt / trailLen) * 2.5;
          ctx.beginPath();
          ctx.arc(tx, ty, r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
          ctx.fill();
        }

        // 流星头部光晕
        var glow = ctx.createRadialGradient(mx, my, 0, mx, my, 12);
        glow.addColorStop(0, 'rgba(255,255,255,0.7)');
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(mx, my, 12, 0, Math.PI * 2);
        ctx.fill();

        // 流星头
        ctx.beginPath();
        ctx.arc(mx, my, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();

        // ── 十二地支六组对穿线（巳亥已有，补子午/丑未/寅申/卯酉/辰戌） ──
        ctx.save();
        var duiPairs = [
          Math.PI / 3,      // 子 → 午
          Math.PI / 2,      // 丑 → 未
          2 * Math.PI / 3,  // 寅 → 申
          5 * Math.PI / 6,  // 卯 → 酉
          Math.PI,          // 辰 → 戌
          7 * Math.PI / 6   // 巳 → 亥
        ];
        for (var pi = 0; pi < duiPairs.length; pi++) {
          var pa = duiPairs[pi];
          var p1 = edgeX(pa);
          var p2 = edgeX(pa + Math.PI);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = 'rgba(255,255,255,0.08)';
          ctx.lineWidth = 0.4;
          ctx.stroke();
        }
        ctx.restore();

        // ── 正三角形（隔4成形，动态外跳，RGB三色，与7路径同频） ──
        var triOff = [4, 8, 12];
        var triColors = ['#C71585', '#00FA9A', '#9370D8'];
        if (path7Alpha > 0.01) {
        ctx.save();
        ctx.globalAlpha = path7Alpha;
        for (var ti = 0; ti < 3; ti++) {
          var p1 = spiralPos(triBase + triOff[ti] - 1);
          var p2 = spiralPos(triBase + triOff[(ti + 1) % 3] - 1);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.shadowColor = triColors[ti] + '44';
          ctx.shadowBlur = 6;

    controls.enableZoom = false;
    controls.enablePan = false;
    controls.minPolarAngle = 0;
    controls.maxPolarAngle = Math.PI;
    controls.update();

    // 滚轮同步到 2D zoom
    canvas.addEventListener('wheel', function(e) {
      e.preventDefault();
      var z = window.__zoom || 0.3;
      z *= e.deltaY > 0 ? 0.92 : 1.08;
      z = Math.max(0.2, Math.min(5.0, z));
      window.__zoom = z;
    }, { passive: false });

    // ── 5408 点云 ──
    var pos = [], col = [], N = 5408;
    for (var i = 0; i < N; i++) {
      var y = 1 - (i / (N - 1)) * 2;
      var r = Math.sqrt(1 - y * y);
      var theta = Math.PI * (3 - Math.sqrt(5)) * i;
      pos.push(r * Math.cos(theta) * 300, y * 300, r * Math.sin(theta) * 300);
      var latPos = (y + 1) * 0.5;
      col.push(latPos, 1 - Math.abs(latPos * 2 - 1), 1 - latPos);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    // 圆形点纹理
    var dotCanvas = document.createElement('canvas');
    dotCanvas.width = 32; dotCanvas.height = 32;
    var dotCtx = dotCanvas.getContext('2d');
    var dotGrad = dotCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
    dotGrad.addColorStop(0, 'rgba(255,255,255,1)');
    dotGrad.addColorStop(0.3, 'rgba(255,255,255,0.8)');
    dotGrad.addColorStop(1, 'rgba(255,255,255,0)');
    dotCtx.fillStyle = dotGrad;
    dotCtx.fillRect(0, 0, 32, 32);
    var dotTexture = new THREE.CanvasTexture(dotCanvas);

    var mat = new THREE.PointsMaterial({
      size: 8, vertexColors: true, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
      map: dotTexture
    });
    var points = new THREE.Points(geo, mat);
    points.renderOrder = 0;
    scene.add(points);

    // ── 12 地支 ──
    var DIZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    var sprites = [];
    for (var di = 0; di < 12; di++) {
      var c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      var cx = c.getContext('2d');
      cx.fillStyle = 'rgba(255,200,100,0.7)';
      cx.font = 'bold 56px system-ui,sans-serif';
      cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.fillText(DIZHI[di], 64, 64);
      var tex = new THREE.CanvasTexture(c);
      var smat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0, depthTest: false });
      var spr = new THREE.Sprite(smat);
      var ang = Math.PI / 6 - di * Math.PI / 6;
      spr.position.set(350 * Math.cos(ang), 0, 350 * Math.sin(ang));
      spr.scale.set(80, 80, 1);
      spr.renderOrder = 1;
      scene.add(spr);
      sprites.push(spr);
    }

    // ── 中心光晕 ──
    var glowGeo = new THREE.SphereGeometry(6, 16, 16);
    var glowMat = new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0 });
    var glow = new THREE.Mesh(glowGeo, glowMat);
    scene.add(glow);

    // ── 窗口大小 ──
    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── 动画循环 ──
    function animate(time) {
      requestAnimationFrame(animate);
      var zoom = window.__zoom || 0.3;
      var t = Math.max(0, Math.min(1, (zoom - 3.5) / 1.5));

      // 相机从球外到球心
      camera.position.lerp(new THREE.Vector3(0, 400 * (1 - t), 400 * (1 - t)), 0.08);
      controls.update();

      // 透明度
      points.material.opacity = t;
      for (var si = 0; si < sprites.length; si++) sprites[si].material.opacity = t * 0.7;
      glow.material.opacity = t * 0.3;

      // 自动旋转（非 3D 模式时缓慢自转）
      if (t < 0.5) {
        var rotSpeed = 0.002;
        points.rotation.y += rotSpeed;
      } else {
        points.rotation.y += 0.005;
      }

      // 呼吸
      var breathe = 0.5 + 0.5 * Math.sin(time * 0.001);
      glow.scale.setScalar(1 + breathe * 0.3);

      renderer.render(scene, camera);
    }
    animate(0);
  </script>
  <script type="module">
    import { initReveal } from './assets/js/reveal.js';
    initReveal();
  </script>
  <script>
    // Scroll-hint fade on scroll
    (function() {
      var hint = document.getElementById('heroScrollHint');
      if (!hint) return;
      var onScroll = function() {
        if (window.scrollY > 20) hint.classList.add('hidden');
        else hint.classList.remove('hidden');
      };
      window.addEventListener('scroll', onScroll, { passive: true });
    })();

  </script>

</body>
</html>
