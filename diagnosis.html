    <script>
        async function runDiagnosis() {
            const input = document.getElementById('brandInput').value.trim();
            if (!input) {
                showError('请输入品牌名或网站地址');
                return;
            }

            const btn = document.getElementById('diagnoseBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            errorMsg.classList.remove('active');
            results.classList.remove('active');
            loading.classList.add('active');

            try {
                // Extract domain from input
                let domain = input;
                if (!input.startsWith('http://') && !input.startsWith('https://')) {
                    // Might be a brand name, try as domain with .com
                    if (input.includes('.')) {
                        domain = 'https://' + input;
                    } else {
                        // Pure brand name - use diagnostic with just the name
                        domain = input;
                    }
                }

                const data = await doDiagnosis(input, domain);
                showResults(data);
            } catch (e) {
                showError('诊断失败：' + e.message);
            } finally {
                btn.disabled = false;
                loading.classList.remove('active');
            }
        }

        async function doDiagnosis(brand, domain) {
            const isUrl = domain.startsWith('http');
            const checks = [];

            let total = 0;
            let passed = 0;

            if (isUrl) {
                // Check 1: robots.txt
                const robotsCheck = await checkRobotsTxt(domain);
                checks.push(robotsCheck);
                if (robotsCheck.pass) passed++;
                total++;

                // Check 2: llms.txt
                const llmsCheck = await checkLlmsTxt(domain);
                checks.push(llmsCheck);
                if (llmsCheck.pass) passed++;
                total++;

                // Check 3: Schema.org
                const schemaCheck = await checkSchema(domain);
                checks.push(schemaCheck);
                if (schemaCheck.pass) passed++;
                total++;

                // Check 4: Page content
                const contentCheck = await checkContent(domain);
                checks.push(contentCheck);
                if (contentCheck.pass) passed++;
                total++;

                // Check 5: HTTPS + SSL
                const httpsCheck = await checkHttps(domain);
                checks.push(httpsCheck);
                if (httpsCheck.pass) passed++;
                total++;

                // Check 6: Page speed hints
                const speedCheck = await checkSpeed(domain);
                checks.push(speedCheck);
                if (speedCheck.pass) passed++;
                total++;

                // Check 7: Meta tags
                const metaCheck = await checkMeta(domain);
                checks.push(metaCheck);
                if (metaCheck.pass) passed++;
                total++;
            } else {
                // Brand name only - basic checks
                checks.push({
                    icon: '🏷️',
                    title: '品牌名称识别',
                    detail: `"${brand}" 已录入诊断系统`,
                    pass: true
                });
                passed++; total++;

                checks.push({
                    icon: '🌐',
                    title: '网站检测',
                    detail: '未提供网站地址，部分检测跳过',
                    pass: null
                });
                total++;

                checks.push({
                    icon: '📋',
                    title: '品牌信息完整度',
                    detail: '建议提供官网地址以获得完整诊断',
                    pass: null
                });
                total++;
            }

            const score = total > 0 ? Math.round((passed / total) * 100) : 0;

            // Generate suggestions
            const suggestions = [];
            checks.forEach(c => {
                if (c.pass === false) {
                    suggestions.push(c.suggestion || `${c.title} — 需要咨询`);
                }
                if (c.pass === null && c.suggestion) {
                    suggestions.push(c.suggestion);
                }
            });

            if (suggestions.length === 0 && isUrl) {
                suggestions.push('你的网站 GEO 基础状态良好！建议进一步做品牌 AI 可见性扫描。');
            }

            return { score, checks, suggestions };
        }

        async function fetchUrl(url, timeout = 8000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            try {
                const resp = await fetch('/api/proxy?url=' + encodeURIComponent(url), {
                    signal: controller.signal
                });
                clearTimeout(timer);
                return resp;
            } catch {
                clearTimeout(timer);
                // Fallback: try direct
                try {
                    const resp = await fetch(url, {
                        mode: 'no-cors',
                        signal: AbortSignal.timeout(timeout)
                    });
                    return resp;
                } catch {
                    return null;
                }
            }
        }

        async function checkRobotsTxt(domain) {
            try {
                const base = new URL(domain).origin;
                const resp = await fetchUrl(base + '/robots.txt');
                if (resp && resp.ok) {
                    const text = await resp.text();
                    const hasGPT = /GPT|ChatGPT|OpenAI|CCBot|Claude-Web|ClaudeBot/i.test(text);
                    return {
                        icon: '🤖',
                        title: 'robots.txt AI 爬虫',
                        detail: hasGPT
                            ? '已允许 AI 爬虫访问 ✓'
                            : '未检测到 AI 爬虫指令，建议添加',
                        pass: hasGPT,
                        suggestion: '在 robots.txt 中添加 Allow: CCBot, GPTBot, Claude-Web 等 AI 爬虫'
                    };
                }
                return {
                    icon: '🤖',
                    title: 'robots.txt',
                    detail: '未找到或无法访问',
                    pass: false,
                    suggestion: '创建 robots.txt 文件，允许 AI 爬虫抓取'
                };
            } catch {
                return {
                    icon: '🤖',
                    title: 'robots.txt',
                    detail: '检测失败',
                    pass: false,
                    suggestion: '确保网站可访问并配置 robots.txt'
                };
            }
        }

        async function checkLlmsTxt(domain) {
            try {
                const base = new URL(domain).origin;
                const resp = await fetchUrl(base + '/llms.txt');
                if (resp && resp.ok) {
                    const text = await resp.text();
                    const hasContent = text.trim().length > 20;
                    return {
                        icon: '📄',
                        title: 'llms.txt',
                        detail: hasContent
                            ? '已配置 ✓ （大模型专用索引文件）'
                            : '文件存在但内容较少',
                        pass: hasContent,
                        suggestion: '完善 llms.txt，添加品牌介绍、核心页面、FAQ 等'
                    };
                }
                return {
                    icon: '📄',
                    title: 'llms.txt',
                    detail: '未配置（大模型专用文件）',
                    pass: false,
                    suggestion: '创建 llms.txt 文件，帮助大模型更好理解你的网站结构'
                };
            } catch {
                return {
                    icon: '📄',
                    title: 'llms.txt',
                    detail: '检测失败',
                    pass: false,
                    suggestion: '确保网站可访问并创建 llms.txt'
                };
            }
        }

        async function checkSchema(domain) {
            try {
                const resp = await fetchUrl(domain);
                if (resp && resp.ok) {
                    const html = await resp.text();
                    const hasJsonLd = html.includes('application/ld+json') || html.includes('"@context"');
                    const hasSchema = /itemscope|itemtype|schema\.org/i.test(html);
                    return {
                        icon: '🔗',
                        title: '结构化数据 (Schema.org)',
                        detail: hasJsonLd
                            ? '检测到 JSON-LD 结构化数据 ✓'
                            : hasSchema
                                ? '检测到部分 Schema 标记，建议补充 JSON-LD'
                                : '未检测到结构化数据',
                        pass: hasJsonLd,
                        suggestion: '添加 JSON-LD 格式的 Organization/Product/FAQ Schema'
                    };
                }
                return {
                    icon: '🔗',
                    title: '结构化数据',
                    detail: '无法获取页面内容',
                    pass: false,
                    suggestion: '确保网站可访问并添加结构化数据'
                };
            } catch {
                return {
                    icon: '🔗',
                    title: '结构化数据',
                    detail: '检测失败',
                    pass: false,
                    suggestion: '添加 JSON-LD 格式的结构化数据'
                };
            }
        }

        async function checkContent(domain) {
            try {
                const resp = await fetchUrl(domain);
                if (resp && resp.ok) {
                    const html = await resp.text();
                    // Check for common content signals
                    const wordCount = html.replace(/<[^>]*>/g, '').split(/\s+/).length;
                    const hasH1 = /<h1[^>]*>[\s\S]*?<\/h1>/i.test(html);
                    const hasMeta = /<meta[^>]+name="description"[^>]*>/i.test(html);
                    return {
                        icon: '📝',
                        title: '内容质量',
                        detail: wordCount > 500
                            ? `页面约 ${wordCount} 字${hasH1 ? '，有 H1 标题 ✓' : '，缺少 H1 标题'}`
                            : '内容较少，建议丰富页面内容',
                        pass: wordCount > 500 && hasH1 && hasMeta,
                        suggestion: '增加原创深度内容（建议每页 1000+ 字），确保有 H1 标题和 Meta Description'
                    };
                }
                return {
                    icon: '📝',
                    title: '内容质量',
                    detail: '无法获取页面内容',
                    pass: false,
                    suggestion: '确保网站可正常访问'
                };
            } catch {
                return {
                    icon: '📝',
                    title: '内容质量',
                    detail: '检测失败',
                    pass: false,
                    suggestion: '添加原创、深度的品牌内容'
                };
            }
        }

        async function checkHttps(domain) {
            try {
                const url = new URL(domain);
                return {
                    icon: '🔒',
                    title: 'HTTPS / SSL',
                    detail: url.protocol === 'https:'
                        ? '已启用 HTTPS ✓'
                        : '未使用 HTTPS，建议开启',
                    pass: url.protocol === 'https:',
                    suggestion: '配置 SSL 证书，全站启用 HTTPS'
                };
            } catch {
                return {
                    icon: '🔒',
                    title: 'HTTPS / SSL',
                    detail: '无法确定',
                    pass: false,
                    suggestion: '确保网站使用 HTTPS'
                };
            }
        }

        async function checkSpeed(domain) {
            return {
                icon: '⚡',
                title: '页面性能',
                detail: '请使用 PageSpeed Insights 进一步检测 Core Web Vitals',
                pass: true,
                suggestion: '咨询 LCP（首屏加载）、INP（交互延迟）、CLS（布局偏移）'
            };
        }

        async function checkMeta(domain) {
            try {
                const resp = await fetchUrl(domain);
                if (resp && resp.ok) {
                    const html = await resp.text();
                    const hasDesc = /<meta[^>]+name="description"[^>]*content="([^"]+)"[^>]*>/i.test(html);
                    const hasOg = /<meta[^>]+property="og:title"[^>]*>/i.test(html);
                    const hasViewport = /<meta[^>]+name="viewport"[^>]*>/i.test(html);
                    let detail = hasDesc ? '有 Meta Description ✓' : '缺 Meta Description';
                    if (hasOg) detail += '，有 Open Graph ✓';
                    if (hasViewport) detail += '，有 Viewport ✓';
                    return {
                        icon: '🏷️',
                        title: 'Meta 标签',
                        detail,
                        pass: hasDesc && hasOg,
                        suggestion: '补充 Meta Description（含关键词），配置 Open Graph 标签'
                    };
                }
                return {
                    icon: '🏷️',
                    title: 'Meta 标签',
                    detail: '无法获取页面',
                    pass: false,
                    suggestion: '确保网站可访问并咨询 Meta 标签'
                };
            } catch {
                return {
                    icon: '🏷️',
                    title: 'Meta 标签',
                    detail: '检测失败',
                    pass: false,
                    suggestion: '添加 Meta Description 和 Open Graph 标签'
                };
            }
        }

        function showResults(data) {
            const results = document.getElementById('results');
            const scoreNum = document.getElementById('scoreNum');
            const scoreBar = document.getElementById('scoreBar');
            const checksList = document.getElementById('checksList');
            const suggestionsDiv = document.getElementById('suggestions');
            const suggestionsList = document.getElementById('suggestionsList');

            // Animate score
            scoreNum.textContent = '0';
            scoreBar.style.width = '0%';
            setTimeout(() => {
                scoreNum.textContent = data.score;
                scoreBar.style.width = data.score + '%';
            }, 100);

            // Render checks
            checksList.innerHTML = data.checks.map(c => `
                <div class="check-item">
                    <div class="check-icon">${c.pass === true ? '✅' : c.pass === false ? '❌' : '➖'}</div>
                    <div class="check-info">
                        <h4>${c.icon} ${c.title}</h4>
                        <p>${c.detail}</p>
                    </div>
                </div>
            `).join('');

            // Render suggestions
            if (data.suggestions && data.suggestions.length > 0) {
                suggestionsDiv.style.display = 'block';
                suggestionsList.innerHTML = data.suggestions.map(s => `<li>${s}</li>`).join('');
            } else {
                suggestionsDiv.style.display = 'none';
            }

            results.classList.add('active');
            results.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function copyReport() {
            const brand = document.getElementById('brandInput').value.trim();
            const score = document.getElementById('scoreNum').textContent;
            const checkItems = document.querySelectorAll('.check-item');
            const suggestionItems = document.querySelectorAll('#suggestionsList li');

            let text = '🔍 紫框 品牌 GEO 诊断报告\n';
            text += '═══════════════════════════════\n\n';
            text += `品牌/网址：${brand}\n`;
            text += `GEO 就绪度评分：${score}/100\n\n`;
            text += '── 检测项 ──\n';
            checkItems.forEach(item => {
                const icon = item.querySelector('.check-icon').textContent.trim();
                const title = item.querySelector('h4').textContent.trim();
                const detail = item.querySelector('p').textContent.trim();
                text += `${icon} ${title}\n   ${detail}\n`;
            });
            if (suggestionItems.length > 0) {
                text += '\n── 咨询建议 ──\n';
                suggestionItems.forEach(s => text += `→ ${s.textContent}\n`);
            }
            text += '\n═══════════════════════════════\n';
            text += '由 紫框 (https://zkoner.com) 生成\n';

            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '✅ 已复制！';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 一键复制报告';
                    btn.classList.remove('copied');
                }, 2500);
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                const btn = document.getElementById('copyBtn');
                btn.textContent = '✅ 已复制！';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 一键复制报告';
                    btn.classList.remove('copied');
                }, 2500);
            });
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('active');
        }
    </script>
</body>
</html>
