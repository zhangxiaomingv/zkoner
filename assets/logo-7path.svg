<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <style>
      @keyframes l0 {
        0%, 32% { stroke: #00FF00 }
        33%, 65% { stroke: #0000FF }
        66%, 99% { stroke: #FF0000 }
        100%     { stroke: #00FF00 }
      }
      @keyframes l1 {
        0%, 32% { stroke: #FF0000 }
        33%, 65% { stroke: #00FF00 }
        66%, 99% { stroke: #0000FF }
        100%     { stroke: #FF0000 }
      }
      @keyframes l2 {
        0%, 32% { stroke: #0000FF }
        33%, 65% { stroke: #FF0000 }
        66%, 99% { stroke: #00FF00 }
        100%     { stroke: #0000FF }
      }
      .l0 { animation: l0 9s linear infinite; }
      .l1 { animation: l1 9s linear infinite; }
      .l2 { animation: l2 9s linear infinite; }
    </style>
  </defs>

  <g filter="url(#shadow)">
    <line class="l0" x1="75" y1="400" x2="250" y2="100" stroke-width="48" stroke-linecap="round"/>
    <line class="l1" x1="250" y1="100" x2="425" y2="400" stroke-width="48" stroke-linecap="round"/>
    <line class="l2" x1="425" y1="400" x2="75" y2="400" stroke-width="48" stroke-linecap="round"/>
  </g>

  <circle cx="250" cy="300" r="40" fill="#0b0405"/>
  <circle cx="250" cy="300" r="8" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.2"/>
</svg>
