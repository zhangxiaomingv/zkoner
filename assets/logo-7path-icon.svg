<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <style>
      /* 顺时针: 左(l0) → 右(l1) → 底(l2) → 左 */
      @keyframes l0 {
        0%, 32% { stroke: #00FF00 }  /* 左: 绿 */
        33%, 65% { stroke: #0000FF } /* 左←底: 紫 */
        66%, 99% { stroke: #FF0000 } /* 左←右: 粉 */
        100%     { stroke: #00FF00 }
      }
      @keyframes l1 {
        0%, 32% { stroke: #FF0000 }  /* 右: 粉 */
        33%, 65% { stroke: #00FF00 } /* 右←左: 绿 */
        66%, 99% { stroke: #0000FF } /* 右←底: 紫 */
        100%     { stroke: #FF0000 }
      }
      @keyframes l2 {
        0%, 32% { stroke: #0000FF }  /* 底: 紫 */
        33%, 65% { stroke: #FF0000 } /* 底←右: 粉 */
        66%, 99% { stroke: #00FF00 } /* 底←左: 绿 */
        100%     { stroke: #0000FF }
      }
      .l0 { animation: l0 9s linear infinite; }
      .l1 { animation: l1 9s linear infinite; }
      .l2 { animation: l2 9s linear infinite; }
    </style>
  </defs>

  <g filter="url(#shadow)">
    <line class="l0" x1="19" y1="103" x2="64" y2="25" stroke-width="12" stroke-linecap="round"/>
    <line class="l1" x1="64" y1="25" x2="109" y2="103" stroke-width="12" stroke-linecap="round"/>
    <line class="l2" x1="109" y1="103" x2="19" y2="103" stroke-width="12" stroke-linecap="round"/>
  </g>

  <circle cx="64" cy="77" r="10" fill="#0b0405"/>
  <circle cx="64" cy="77" r="2" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.2"/>
</svg>
